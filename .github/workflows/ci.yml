name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gates:
    name: gates (build + typecheck + lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: typecheck
        run: pnpm typecheck

      - name: lint:check
        run: pnpm lint:check

      - name: test
        run: pnpm test

      - name: demo (G3 — clean run end-to-end)
        run: pnpm personabench demo
